name: Production YAML Multi-Layer Validation

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 第一层：语法与格式静态检查 (yamllint)
      # ==========================================
      - name: Set up Yamllint
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint

      - name: Run Yamllint
        run: |
          echo "=== [Layer 1] Running Yamllint (Syntax & Style Check) ==="
          # 对 argocd 目录下的 yaml 文件进行规范检查
          yamllint argocd/

      # ==========================================
      # 第二层：Kubernetes API Schema 规范校验 (Kubeconform)
      # ==========================================
      - name: Install Kubeconform
        run: |
          echo "=== Installing Kubeconform ==="
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Run Kubeconform
        run: |
          echo "=== [Layer 2] Running Kubeconform (API Schema Check) ==="
          # -strict: 严格模式，禁止未知字段
          # -ignore-missing-schemas: 忽略自定义资源(CRD)等未收录的 schema
          # -kubernetes-version: 指定集群校验的版本
          kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 manifests/

      # ==========================================
      # 第三层：Kubernetes 客户端干跑校验 (kubectl dry-run)
      # ==========================================
      - name: Set up kubectl
        run: |
          echo "=== Setting up kubectl ==="
          curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Run Client-side Dry-Run
        run: |
          echo "=== [Layer 3] Running Kubectl Client Dry-Run ==="
          # 利用 Kubernetes 官方客户端解析并验证清单的合法性
          kubectl apply --dry-run=client -f argocd/
